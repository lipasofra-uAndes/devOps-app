version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: blacklist-api

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      python: 3.11
    commands:
      - python --version
      - pip install --upgrade pip
      - python -m pip install -r requirements-dev.txt

  pre_build:
    on-failure: ABORT
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 358148451739.dkr.ecr.us-east-1.amazonaws.com

  build:
    on-failure: ABORT
    commands:
      - echo Build started on `date`
      - python -m pytest -q --junitxml=reports/tests.xml
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo Building the Docker image...          
      - docker build -t 358148451739.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG .

  post_build:
    on-failure: ABORT
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 358148451739.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - IMAGE_URI=$(docker inspect --format='{{index .RepoDigests 0}}' 358148451739.dkr.ecr.us-east-1.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG)
      - echo Writing Image Definitions file...
      - printf '{"ImageURI":"%s"}' "$IMAGE_URI" > imageDetail.json

reports:
  pytest_reports:
    files:
      - tests.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - appspec.yaml
    - taskdef.json
    - imageDetail.json
