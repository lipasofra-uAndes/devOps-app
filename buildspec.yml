version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: blacklist-api

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python --version
      - pip install --upgrade pip

  pre_build:
    on-failure: ABORT
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 358148451739.dkr.ecr.us-east-1.amazonaws.com

  build:
    on-failure: ABORT
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...          
      - docker build -t blacklist-api:latest .
      - docker tag blacklist-api:latest 358148451739.dkr.ecr.us-east-1.amazonaws.com/blacklist-api:latest

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 358148451739.dkr.ecr.us-east-1.amazonaws.com/blacklist-api:latest
      - echo Writing Image Definitions file...
      - printf '[{"name":"Container-app-python","imageUri":"358148451739.dkr.ecr.us-east-1.amazonaws.com/blacklist-api:latest"}]' > imagedefinitions.json
      - printf '{"ImageURI":"358148451739.dkr.ecr.us-east-1.amazonaws.com/blacklist-api:latest"}' > imageDetail.json
      - cat imagedefinitions.json 

reports:
  pytest_reports:
    files:
      - tests.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - '**/*'
    - imagedefinitions.json
    - imageDetail.json
  secondary-artifacts:
    DefinitionArtifact:
      files:
        - appspec.yaml
        - taskdef.json
    ImageArtifact:
      files:
        - imageDetail.json
