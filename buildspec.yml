version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python --version
      - pip install --upgrade pip

  pre_build:
    commands:
      - pip install -r requirements-dev.txt

  build:
    on-failure: ABORT
    commands:
      - python -m pytest -v --junitxml=reports/tests.xml
      - python scripts/package_artifact.py

artifacts:
  name: blacklist-api-$CODEBUILD_BUILD_NUMBER
  files:
    - blacklist-api.zip
  base-directory: dist
  discard-paths: no
